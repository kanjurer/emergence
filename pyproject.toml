[project]
name = "emergence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kanjurer" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "torch>=2.14.1",
]

[project.scripts]
emergence = "emergence:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
